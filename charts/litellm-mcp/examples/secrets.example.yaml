# -----------------------------------------------------------------------------
# Secrets for charts/litellm-mcp - PLACEHOLDERS ONLY. Never commit real values.
#
# This is the method used on woow-k3s (values secrets.create=false): the
# Secrets are created once, outside Helm, so no chart upgrade can ever overwrite
# a rotated token with an empty string. Copy this file OUTSIDE the repository,
# replace every REPLACE_ME, then apply the copy:
#
#   kubectl --context woow-k3s apply -f /secure/path/litellm-mcp-secrets.yaml
#
# The alternative is secrets.create=true with a values file kept outside the
# repo; see README "Install".
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: litellm-mcp-secret
  namespace: litellm-mcp
  labels:
    app.kubernetes.io/part-of: woow-litellm
type: Opaque
stringData:
  # The gateway this console administers. Re-read from here on EVERY pod start,
  # so rotating the master key below reaches the console on the next restart.
  LITELLM_BASE_URL: "http://litellm.litellm.svc.cluster.local:4000"
  # Must equal LITELLM_MASTER_KEY in the litellm chart's litellm-secrets.
  # This key can create and delete virtual keys - treat it as root.
  LITELLM_MASTER_KEY: "REPLACE_ME_sk-..."
  # Present in the live Secret for parity with the litellm chart; the console
  # reads JWT_SECRET from litellm-mcp-admin-secret below.
  JWT_SECRET: "REPLACE_ME_JWT_SECRET"
---
apiVersion: v1
kind: Secret
metadata:
  name: litellm-mcp-admin-secret
  namespace: litellm-mcp
  labels:
    app.kubernetes.io/part-of: woow-litellm
type: Opaque
stringData:
  # FIRST-BOOT SEEDS. After the first start /data/config.json on the PVC is the
  # source of truth: the Settings page changes the password and the Tokens page
  # rotates the MCP token, and seed-config uses setdefault so a restart never
  # reverts them. Changing these afterwards changes nothing.
  ADMIN_PASSWORD: "REPLACE_ME_ADMIN_PASSWORD"
  # The ONLY credential on the public MCP endpoint /private_<token>/mcp/.
  # Generate it, never type it: openssl rand -hex 32
  MCP_AUTH_TOKEN: "REPLACE_ME_MCP_AUTH_TOKEN"
  # Signs console session JWTs. Changing it invalidates every open session.
  JWT_SECRET: "REPLACE_ME_JWT_SECRET"
