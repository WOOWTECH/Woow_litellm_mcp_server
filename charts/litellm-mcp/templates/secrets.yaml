{{- /*
Rendered ONLY with secrets.create=true (fresh installs and tests). The default
is false: on woow-k3s these two Secrets already exist and are managed outside
Helm, and an upgrade that re-rendered them from empty values would overwrite a
rotated MCP token with "".

Every value is required(): there is no default, no placeholder and no weak
fallback to ship. `helm template --set secrets.create=true` alone must fail.
*/ -}}
{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.existingSecrets.connection }}
  namespace: {{ include "litellmMcp.ns" . }}
  labels:
    {{- include "litellmMcp.partOf" . | nindent 4 }}
  {{- include "litellmMcp.keepAnnotations" . | nindent 2 }}
type: Opaque
stringData:
  LITELLM_BASE_URL: {{ required "secrets.litellmBaseUrl is required when secrets.create=true" .Values.secrets.litellmBaseUrl | quote }}
  LITELLM_MASTER_KEY: {{ required "secrets.litellmMasterKey is required when secrets.create=true" .Values.secrets.litellmMasterKey | quote }}
  JWT_SECRET: {{ required "secrets.jwtSecret is required when secrets.create=true" .Values.secrets.jwtSecret | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.existingSecrets.admin }}
  namespace: {{ include "litellmMcp.ns" . }}
  labels:
    {{- include "litellmMcp.partOf" . | nindent 4 }}
  {{- include "litellmMcp.keepAnnotations" . | nindent 2 }}
type: Opaque
stringData:
  ADMIN_PASSWORD: {{ required "secrets.adminPassword is required when secrets.create=true" .Values.secrets.adminPassword | quote }}
  MCP_AUTH_TOKEN: {{ required "secrets.mcpAuthToken is required when secrets.create=true" .Values.secrets.mcpAuthToken | quote }}
  JWT_SECRET: {{ required "secrets.jwtSecret is required when secrets.create=true" .Values.secrets.jwtSecret | quote }}
{{- end }}
