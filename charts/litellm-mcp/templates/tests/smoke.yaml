{{- /*
`helm test` smoke pod. Read-only:
  - the console answers GET /healthz with 200 {"status":"ok"}
  - the console's Service routes to a ready pod
  - (tests.checkUpstream) the configured LITELLM_BASE_URL answers
    /health/liveliness - LiteLLM serves it unauthenticated, so the pod never
    needs the master key and nothing is written anywhere.
Uses python:3.12-slim: the console image ships no curl either.
*/ -}}
{{- if .Values.tests.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-smoke
  namespace: {{ include "litellmMcp.ns" . }}
  labels:
    {{- include "litellmMcp.partOf" . | nindent 4 }}
    app.kubernetes.io/component: smoke-test
  annotations:
    helm.sh/hook: test
    # Kept until the next `helm test` so `helm test --logs` can always read it.
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  containers:
    - name: smoke
      image: {{ .Values.tests.image }}
      command: [python, -c]
      args:
        - |
          import json, os, urllib.request
          def get(url):
              with urllib.request.urlopen(url, timeout=15) as r:
                  return r.status, r.read().decode()
          admin = os.environ["ADMIN_URL"]
          status, body = get(admin + "/healthz")
          assert status == 200, (status, body)
          assert json.loads(body).get("status") == "ok", body
          print("console /healthz:", body.strip())
          base = (os.environ.get("LITELLM_BASE_URL") or "").rstrip("/")
          if base:
              status, body = get(base + "/health/liveliness")
              assert status == 200, (status, body)
              print("upstream", base, "liveliness:", body.strip()[:80])
          print("SMOKE OK")
      env:
        - name: ADMIN_URL
          value: {{ include "litellmMcp.adminUrl" . | quote }}
        {{- if .Values.tests.checkUpstream }}
        - name: LITELLM_BASE_URL
          valueFrom:
            secretKeyRef:
              name: {{ .Values.existingSecrets.connection }}
              key: LITELLM_BASE_URL
        {{- end }}
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 500m
          memory: 256Mi
{{- end }}
