# =============================================================================
# Woow LiteLLM MCP — shared base resources
# =============================================================================
#
# This file carries ONLY the two things every deployment of this project needs
# before anything else can start:
#
#   1. Namespace  litellm-mcp
#   2. Secret     litellm-mcp-secret   (upstream LiteLLM gateway credentials)
#
# It deliberately contains NO workload. That separation is the whole point of
# the file: an earlier layout shipped the namespace, the secret AND a bare,
# unauthenticated MCP server Deployment in one manifest, so anyone following the
# documented apply order silently got the unauthenticated endpoint as well. See
# FINDING-003 in findings.md.
#
# Apply order:
#   kubectl apply -f k8s-base.yaml
#   kubectl apply -f k8s-admin-deploy.yaml
#
# -----------------------------------------------------------------------------
# ⚠  READ THIS BEFORE APPLYING TO A CLUSTER THAT IS ALREADY RUNNING
# -----------------------------------------------------------------------------
# The Secret below holds PLACEHOLDERS. `kubectl apply -f k8s-base.yaml` on a
# cluster where the real Secret already exists WILL overwrite the real master
# key with "sk-REPLACE_ME" and break the console's upstream connection.
#
# On an existing cluster, apply the Namespace only:
#
#   kubectl apply -f k8s-base.yaml --prune=false \
#     -l app.kubernetes.io/part-of=woow-litellm-mcp   # (namespace carries the label)
#
# or simply skip this file — the namespace and secret are already there.
#
# For a first install, do not edit this file. Create the Secret from the command
# line so the real key never touches the working tree or the shell history file:
#
#   kubectl create namespace litellm-mcp
#   kubectl create secret generic litellm-mcp-secret -n litellm-mcp \
#     --from-literal=LITELLM_BASE_URL='http://litellm.litellm.svc.cluster.local:4000' \
#     --from-literal=LITELLM_MASTER_KEY="$(read -rs -p 'master key: ' k; echo "$k")"
#
# =============================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: litellm-mcp
  labels:
    app.kubernetes.io/part-of: woow-litellm-mcp
---
# -----------------------------------------------------------------------------
# Secret — PLACEHOLDER VALUES ONLY. Never commit real keys.
#
# Consumed by the `seed-config` initContainer in k8s-admin-deploy.yaml, which
# writes them into /data/config.json as the console's upstream connection.
#
# The console's own credentials (admin password, proxy token, JWT signing key)
# are NOT here — they live in Secret `litellm-mcp-admin-secret`, defined in
# k8s-admin-deploy.yaml, so that gateway credentials and console credentials can
# be rotated independently.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: litellm-mcp-secret
  namespace: litellm-mcp
  labels:
    app.kubernetes.io/part-of: woow-litellm-mcp
type: Opaque
stringData:
  # In-cluster Service DNS of the LiteLLM gateway (namespace litellm, svc litellm).
  # Cluster-internal on purpose: the traffic never leaves the cluster, so it does
  # not depend on the public Cloudflare tunnel being up.
  LITELLM_BASE_URL: "http://litellm.litellm.svc.cluster.local:4000"
  # LiteLLM master key — REPLACE. Never store the real value in git.
  LITELLM_MASTER_KEY: "sk-REPLACE_ME"
