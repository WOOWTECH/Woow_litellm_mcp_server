# -----------------------------------------------------------------------------
# Woow LiteLLM MCP — Secret template (PLACEHOLDERS ONLY)
# -----------------------------------------------------------------------------
# Copy, fill in real values, and apply OUT-OF-BAND. Never commit real secrets.
#
#   cp k8s-secret.example.yaml /tmp/litellm-mcp-secret.yaml
#   # edit /tmp/litellm-mcp-secret.yaml   (paste the real master key + JWT hex)
#   kubectl apply -f /tmp/litellm-mcp-secret.yaml
#
# Generate a JWT secret with:  openssl rand -hex 32
#
# The repo Deployments reference these keys via secretKeyRef only — the real
# key never appears in any committed manifest or image layer.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Namespace
metadata:
  name: litellm-mcp
---
apiVersion: v1
kind: Secret
metadata:
  name: litellm-mcp-secret
  namespace: litellm-mcp
type: Opaque
stringData:
  # In-cluster Service DNS of the LiteLLM gateway.
  LITELLM_BASE_URL: "http://litellm.litellm.svc.cluster.local:4000"
  # LiteLLM master key (sk-...). REPLACE with the real value at apply time.
  LITELLM_MASTER_KEY: "sk-REPLACE_ME"
  # Signs admin-GUI JWTs (image-based / admin path only). `openssl rand -hex 32`.
  JWT_SECRET: "REPLACE_WITH_RANDOM_HEX"
