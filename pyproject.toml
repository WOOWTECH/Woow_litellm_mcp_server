[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "woow-litellm-mcp-server"
version = "0.1.0"
description = "FastMCP server + admin console exposing a LiteLLM gateway as MCP tools"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "WOOWTECH" }]
keywords = ["mcp", "litellm", "fastmcp", "llm-gateway", "claude"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

# Component 1 — the FastMCP server — has a minimal dependency footprint so the
# git-clone k3s deployment can `pip install .` quickly at pod start.
dependencies = [
    "fastmcp>=2.0",
    "mcp>=1.2",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
# Component 2/3 — the admin console (mcp_admin_core + litellm_mcp_admin). Only
# needed when running the Web GUI / encrypted proxy, not for the bare MCP server.
admin = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pyjwt>=2.9",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1",
]
# Test / dev tooling.
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]
dev = [
    "woow-litellm-mcp-server[admin,test]",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/WOOWTECH/Woow_litellm_mcp_server"
Repository = "https://github.com/WOOWTECH/Woow_litellm_mcp_server"

[project.scripts]
woow-litellm-mcp-server = "woow_litellm_mcp_server.server:main"

# Two wheels are produced from this repo: the MCP server package and the thin
# LiteLLM-specific admin layer. The product-agnostic `mcp_admin_core` ships as a
# separate wheel via `mcp_admin_core.pyproject.toml`, but is also included here
# so `pip install .[admin]` yields a runnable console from a single checkout.
[tool.hatch.build.targets.wheel]
packages = [
    "woow_litellm_mcp_server",
    "litellm_mcp_admin",
    "mcp_admin_core",
]

[tool.hatch.build.targets.sdist]
include = [
    "/woow_litellm_mcp_server",
    "/litellm_mcp_admin",
    "/mcp_admin_core",
    "/tests",
    "/README.md",
    "/README_zh-TW.md",
    "/LICENSE",
    "/pyproject.toml",
    "/pytest.ini",
]

[tool.ruff]
line-length = 100
target-version = "py311"
